
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcify | Smart Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-container">

        <header>
            <div>
                <h1>calcify<span>.</span></h1>
                <p>Your little math companion</p>
            </div>
            <div class="status">● ONLINE</div>
        </header>

        <div class="calculator">

            <div class="display">
                <div class="previous" id="previous">Ready to calculate?</div>
                <div class="current" id="current">0</div>
            </div>

            <div class="buttons">

                <button class="special" data-action="clear">AC</button>
                <button class="special" data-action="delete">DEL</button>
                <button class="special" data-action="percent">%</button>
                <button class="operator" data-operator="/">÷</button>

                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button class="operator" data-operator="*">×</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button class="operator" data-operator="-">−</button>

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button class="operator" data-operator="+">+</button>

                <button data-action="sign">+/−</button>
                <button data-number="0">0</button>
                <button data-action="decimal">.</button>
                <button class="equal" data-action="equals">=</button>

            </div>

        </div>

        <div class="history-section">
            <div class="history-heading">
                <h3>Recent calculation</h3>
                <button id="clearHistory">Clear history</button>
            </div>
            <ul id="history">
                <li class="empty">Your calculations will appear here.</li>
            </ul>
        </div>

        <footer>
            Made with <span>love</span> and a little logic.
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
